<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- API endpoint + automatic failover (Firebase <-> MacBook). Must load before any page script. -->
    <script src="api-env.js"></script>
    <script src="api-config.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <title>Owl Watcher | Contest & Spin Game</title>
    <style>
        /* Contest page specifics (shared components live in theme.css) */
        .ad-preview-img { display: block; width: 100%; height: auto; max-height: 60vh; object-fit: contain; margin: 0 0 18px; border-radius: var(--ow-radius); background: var(--ow-surface-2); }
        .question-box { margin: 0 0 14px; font-size: 1.2rem; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
        #attemptsNotice:not(:empty) { margin: 0 0 14px; padding: 10px 14px; border-radius: var(--ow-radius); background: var(--ow-danger-soft); color: var(--ow-danger); font-weight: 600; font-size: 0.9rem; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 380px) { .options-grid { grid-template-columns: 1fr; } }
        .option-btn { width: 100%; min-height: 54px; background: var(--ow-surface); color: var(--ow-text); box-shadow: inset 0 0 0 1.5px var(--ow-border-strong); font-weight: 600; }
        @media (hover: hover) and (pointer: fine) { .option-btn:hover { box-shadow: inset 0 0 0 2px var(--ow-primary), var(--ow-shadow-hover); color: var(--ow-primary-text); } }
        .step-title { font-size: 1.15rem; margin: 0 0 10px; }
        .contest-alert p, #contestArea > p { margin: 0; color: var(--ow-danger); font-weight: 700; }
        .contest-error { margin: 10px 0 0; color: var(--ow-danger); font-weight: 600; }
        #rollerDisplay { display: grid; place-items: center; min-height: 110px; margin: 12px 0 16px; padding: 16px; border-radius: var(--ow-radius-lg); background: var(--ow-surface-2); border: 1px solid var(--ow-border); color: var(--ow-primary-text); font-size: 2.4rem; font-weight: 800; letter-spacing: 0.02em; text-align: center; }
        .win-title { color: var(--ow-success); font-size: 1.6rem; }
        .win-success { color: var(--ow-success); font-weight: 700; }
    </style>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f2ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0b0a" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="theme.css">
    <!-- Native bridge must load before the optional update prompt. -->
    <script src="capacitor.js"></script>
    <script src="update-popup.js"></script>
    <script src="menu.js"></script>
</head>
<body>

 <nav class="main-nav" aria-label="Page navigation">
    <div class="nav-logo">
        <img src="owl.png" alt="Owl Watcher logo" width="42" height="42">
        <span>Owl Watcher Contest</span>
    </div>
    <a href="index.html" class="btn btn-secondary btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Home
    </a>
</nav>

<main class="page">
    <header class="page-header">
        <span class="eyebrow">🎡 Contest</span>
        <h1 class="page-title">Answer, spin &amp; win</h1>
        <p class="page-subtitle">Get the question right to unlock the lucky spin.</p>
    </header>

    <section class="card contest-card" aria-label="Contest">
        <!-- Dynamic Ad Image Container -->
        <div id="adImageContainer">
            <img id="linkedAdImg" src="owl.png" alt="Contest ad" class="ad-preview-img" style="display:none;">
        </div>

        <!-- Device Verification Check Prompt (Hidden until lookup completes) -->
        <div id="deviceCheckPrompt" class="note contest-alert" style="display:none;">
            <p id="participationNotice">Checking device…</p>
        </div>

        <!-- Step 1: Trivia Question -->
        <div id="contestArea">
            <div class="question-box" id="questionText">Loading contest question...</div>
            <div id="attemptsNotice"></div>
            <div class="options-grid" id="optionsContainer"></div>
        </div>

        <!-- Step 2: Society Verification Box (Hidden initially) -->
        <div id="societySection" style="display:none;">
            <h2 class="step-title">✅ Correct answer! Enter your society name</h2>
            <label for="societyInput">Society name</label>
            <input type="text" id="societyInput" class="input-box" placeholder="e.g. Sunflower Society">
            <button type="button" class="action-btn btn-block" onclick="verifySocietyAndProceed()">Verify &amp; enter spin game</button>
            <p id="societyError" class="contest-error" style="display:none;"></p>
        </div>

        <!-- Step 3: Spin Game Box (Hidden initially) -->
        <div id="spinSection" style="display:none;">
            <h2 class="step-title">Lucky spin roller 🎡</h2>
            <div id="rollerDisplay" aria-live="polite">Ready to Spin?</div>
            <button type="button" id="spinBtn" class="action-btn btn-block btn-lg" onclick="executeSpin()">SPIN NOW</button>
            <p id="spinNotice" class="muted small text-center"></p>
        </div>
    </section>

    <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Back to home
    </a>
</main>

<!-- Winner details are verified by the API before WhatsApp is enabled. -->
<div id="resultModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
        <span class="close" role="button" tabindex="0" aria-label="Close" onclick="document.getElementById('resultModal').style.display='none'">&times;</span>
        <h2 id="modalTitle" class="win-title">You won!</h2>
        <p id="winnerDetails" aria-live="polite"></p>
        <p id="winningCode" class="win-success"></p>
        <a id="winnerWhatsApp" class="btn btn-success btn-block" target="_blank" rel="noopener" style="display:none;">Send winning details on WhatsApp</a>
        <button type="button" id="retryWinnerBtn" class="btn btn-secondary btn-block" style="display:none;">Retry winner verification</button>
    </div>
</div>

<script type="module">
    import { Device } from 'https://cdn.jsdelivr.net/npm/@capacitor/device@latest/+esm';
    const API_BASE_URL = (window.OWL_API_BASE || 'https://us-central1-finder-owl.cloudfunctions.net/api');
    const NG_HEADERS = { 'ngrok-skip-browser-warning': 'true' };
    const jsonHeaders = { 'Content-Type': 'application/json', ...NG_HEADERS };
    const adImgUrl = new URLSearchParams(window.location.search).get('adImg');
    const contestId = adImgUrl || 'default';
    if (adImgUrl) {
        const img = document.getElementById('linkedAdImg');
        img.src = adImgUrl;
        img.style.display = 'inline-block';
    }
    let deviceId = '';
    let isRegistered = false;
    let validatedSocietyName = '';
    let linkedFlatNumber = '';
    const attemptsKey = `attempts_ad_${contestId}`;
    const blockKey = `failed_ad_${contestId}`;
    const passedKey = `passed_ad_${contestId}`;
    let winningPayload = null;

    async function getDeviceIdentifier() {
        try {
            const info = await Device.getId();
            if (info.identifier || info.uuid) return info.identifier || info.uuid;
        } catch (_) { /* Browser fallback below. */ }
        let id = localStorage.getItem('mockDeviceId');
        if (!id) {
            if (!window.crypto || typeof window.crypto.getRandomValues !== 'function') throw new Error('Device identification is unavailable.');
            const bytes = new Uint8Array(16);
            window.crypto.getRandomValues(bytes);
            id = 'web-' + Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
            localStorage.setItem('mockDeviceId', id);
        }
        return id;
    }
    function contestError(message) {
        const area = document.getElementById('contestArea');
        area.replaceChildren();
        const text = document.createElement('p');
        text.textContent = message;
        area.appendChild(text);
    }
    function showSpinOrSociety() {
        document.getElementById('contestArea').style.display = 'none';
        if (isRegistered) {
            document.getElementById('societySection').style.display = 'block';
        } else {
            validatedSocietyName = 'Guest';
            document.getElementById('spinSection').style.display = 'block';
        }
    }
    function showAttempts(remaining) {
        document.getElementById('attemptsNotice').textContent = `⚠️ You have ${remaining} attempt${remaining === 1 ? '' : 's'} left for this contest.`;
    }
    function answer(choice, correctIndex) {
        try {
            let attempts = Math.max(0, Number.parseInt(localStorage.getItem(attemptsKey) || '0', 10) || 0);
            if (localStorage.getItem(blockKey) || attempts >= 2) {
                contestError('You have already used your 2 attempts for this contest.');
                return;
            }
            attempts++;
            localStorage.setItem(attemptsKey, String(attempts));
            if (choice === correctIndex) {
                localStorage.setItem(passedKey, 'true');
                showSpinOrSociety();
            } else if (attempts >= 2) {
                localStorage.setItem(blockKey, 'true');
                contestError('Incorrect. You have used your 2 attempts for this contest.');
            } else {
                showAttempts(2 - attempts);
                alert('Incorrect answer. You have 1 attempt left.');
            }
        } catch (_) {
            contestError('Device storage is unavailable. Enable it and reload to play.');
        }
    }
    async function loadContest() {
        if (localStorage.getItem(passedKey) === 'true') { showSpinOrSociety(); return; }
        const attempts = Math.max(0, Number.parseInt(localStorage.getItem(attemptsKey) || '0', 10) || 0);
        if (localStorage.getItem(blockKey) || attempts >= 2) {
            contestError('You have already used your 2 attempts for this contest.');
            return;
        }
        let question = 'Default Question: What does Owl Watcher secure?';
        let options = ['Vehicles & Societies', 'Outer Space', 'Deep Ocean', 'Volcanoes'];
        let correctIndex = 0;
        if (adImgUrl) {
            const res = await fetch(`${API_BASE_URL}/ads/global`, { headers: NG_HEADERS });
            if (!res.ok) throw new Error('Could not load the contest. Please retry.');
            const ads = await res.json();
            if (!Array.isArray(ads)) throw new Error('Could not load the contest. Please retry.');
            const ad = ads.find(item => item && item.imageUrl === adImgUrl);
            if (!ad) throw new Error('Contest not found. Please return to the home page.');
            if (ad.question && Array.isArray(ad.options) && ad.options.length >= 2) {
                question = String(ad.question);
                options = ad.options;
                const parsed = Number.parseInt(ad.correctIndex, 10);
                correctIndex = Number.isInteger(parsed) && parsed >= 0 && parsed < options.length ? parsed : 0;
            }
        }
        document.getElementById('questionText').textContent = question;
        const container = document.getElementById('optionsContainer');
        container.replaceChildren();
        options.forEach((option, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'option-btn';
            button.textContent = option;
            button.addEventListener('click', () => answer(index, correctIndex));
            container.appendChild(button);
        });
        showAttempts(2 - attempts);
    }
    window.onload = async function() {
        try {
            deviceId = await getDeviceIdentifier();
            const res = await fetch(`${API_BASE_URL}/verify-device/${encodeURIComponent(deviceId)}`, { headers: NG_HEADERS });
            if (!res.ok) throw new Error('Could not check this device. Please retry.');
            const data = await res.json();
            if (typeof data.registered !== 'boolean') throw new Error('Could not check this device. Please retry.');
            isRegistered = data.registered;
            const notice = document.getElementById('deviceCheckPrompt');
            document.getElementById('participationNotice').textContent = isRegistered
                ? 'Playing with your registered device.' : 'Playing as a guest. Answer the question to enter.';
            notice.style.display = 'block';
            await loadContest();
        } catch (err) { contestError(err.message || 'Could not load the contest. Please retry.'); }
    };
    async function verifySocietyAndProceed() {
        const society = document.getElementById('societyInput').value.trim();
        const error = document.getElementById('societyError');
        if (!society) { error.textContent = 'Please enter a society name.'; error.style.display = 'block'; return; }
        try {
            const res = await fetch(`${API_BASE_URL}/societies/verify?name=${encodeURIComponent(society)}`, { headers: NG_HEADERS });
            if (!res.ok) throw new Error('Society name not found. Please check spelling.');
            const found = await res.json();
            const name = found.name || society;
            const query = new URLSearchParams({ societyName: name });
            const check = await fetch(`${API_BASE_URL}/verify-device/${encodeURIComponent(deviceId)}?${query}`, { headers: NG_HEADERS });
            if (!check.ok) throw new Error('Could not verify the registered device.');
            const record = await check.json();
            if (!record.registered || !record.flatNumber) throw new Error('This device is not linked to a flat in that society.');
            validatedSocietyName = name;
            linkedFlatNumber = String(record.flatNumber).trim();
            document.getElementById('societySection').style.display = 'none';
            document.getElementById('spinSection').style.display = 'block';
        } catch (err) { error.textContent = err.message || 'Could not verify the society.'; error.style.display = 'block'; }
    }
    window.verifySocietyAndProceed = verifySocietyAndProceed;

    async function setWhatsApp(message) {
        const link = document.getElementById('winnerWhatsApp');
        link.style.display = 'none';
        try {
            const res = await fetch(`${API_BASE_URL}/config`, { headers: NG_HEADERS });
            if (!res.ok) throw new Error('Team contact unavailable.');
            const config = await res.json();
            const phone = String(config.teamPhone || '').replace(/\D/g, '');
            if (phone.length < 10 || phone.length > 15) throw new Error('Team contact unavailable.');
            link.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            link.style.display = 'inline-flex';
        } catch (_) {
            document.getElementById('winnerDetails').textContent += ' Team WhatsApp number is unavailable. Please retry.';
            document.getElementById('retryWinnerBtn').style.display = 'block';
        }
    }
    async function showWinningDetails(payload) {
        winningPayload = payload;
        document.getElementById('resultModal').style.display = 'block';
        document.getElementById('retryWinnerBtn').style.display = 'none';
        document.getElementById('winningCode').textContent = '';
        if (!isRegistered) {
            if (!/^[1-9]\d{8}$/.test(String(payload.winningCode || ''))) {
                document.getElementById('winnerDetails').textContent = 'A newer guest win has replaced the latest code, and this device has no saved copy. Please contact the team.';
                return;
            }
            document.getElementById('winnerDetails').textContent = 'Your guest win is registered. Keep this code and send it to the Owl Watcher team.';
            document.getElementById('winningCode').textContent = `Winning code: ${payload.winningCode}`;
            await setWhatsApp(`Hello Owl Watcher team, I won the contest as a guest. My winning code is ${payload.winningCode}. Please verify my win.`);
            return;
        }
        document.getElementById('winnerDetails').textContent = 'Verifying your registered winning details…';
        try {
            const res = await fetch(`${API_BASE_URL}/contest/winner`, { method: 'POST', headers: jsonHeaders,
                body: JSON.stringify({ societyName: validatedSocietyName, flatNumber: linkedFlatNumber, deviceId, contestId, recover: true }) });
            const result = await res.json();
            if (!res.ok) throw new Error(result.error || 'Winner verification failed.');
            document.getElementById('winnerDetails').textContent = `Registered win: ${result.societyName}, flat/name ${result.flatNumber}.`;
            await setWhatsApp(`Hello Owl Watcher team, I won the contest. Society: ${result.societyName}. Flat number/name: ${result.flatNumber}. Please verify my win.`);
        } catch (err) {
            document.getElementById('winnerDetails').textContent = err.message || 'Could not verify your win. Please retry.';
            document.getElementById('retryWinnerBtn').style.display = 'block';
        }
    }
    document.getElementById('retryWinnerBtn').addEventListener('click', () => showWinningDetails(winningPayload || {}));
    async function executeSpin() {
        const roller = document.getElementById('rollerDisplay');
        const button = document.getElementById('spinBtn');
        button.disabled = true;
        roller.textContent = 'Spinning…';
        try {
            const endpoint = isRegistered ? '/contest/spin' : '/contest/guest/spin';
            const payload = isRegistered ? { societyName: validatedSocietyName, deviceId, flatNumber: linkedFlatNumber, contestId } : { deviceId, contestId };
            const res = await fetch(`${API_BASE_URL}${endpoint}`, { method: 'POST', headers: jsonHeaders, body: JSON.stringify(payload) });
            const data = await res.json();
            if (!res.ok) {
                if (isRegistered && res.status === 409) {
                    roller.textContent = 'Already played';
                    document.getElementById('spinNotice').textContent = 'You already spun today. If you won, recover your winning details below.';
                    button.textContent = 'Recover winning details';
                    button.onclick = () => showWinningDetails({});
                    button.disabled = false;
                    return;
                }
                throw new Error(data.error || 'Could not complete the spin.');
            }
            button.style.display = 'none';
            if (!isRegistered && data.won && typeof data.attemptId === 'string') {
                const codeKey = `guest_winning_code_${data.attemptId}`;
                try {
                    if (/^[1-9]\d{8}$/.test(String(data.winningCode || ''))) localStorage.setItem(codeKey, String(data.winningCode));
                    else data.winningCode = localStorage.getItem(codeKey);
                } catch (_) { /* The current response still contains the code when available. */ }
            }
            if (data.won) {
                roller.textContent = 'WON!';
                await showWinningDetails(data);
            } else {
                roller.textContent = 'Better luck next time!';
                document.getElementById('spinNotice').textContent = data.alreadyPlayed ? 'You already spun today.' : 'Spin completed.';
            }
        } catch (err) {
            roller.textContent = 'Could not complete the spin';
            document.getElementById('spinNotice').textContent = err.message || 'Please retry.';
            button.disabled = false;
        }
    }
    window.executeSpin = executeSpin;
</script>

</body>
</html>
