    <main class="page">
        <header class="page-header">
            <span class="eyebrow">📢 Society notice</span>
            <h1 class="page-title">Full notice</h1>
            <p class="page-subtitle" id="notice-date">Loading date...</p>
        </header>
        <article class="card">
            <div id="notice-full-content" class="full-content">Loading content...</div>
        </article>
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            Back to home
        </a>
    </main>


    <script>
        const API_BASE_URL = 'https://api.owlwatcher.tech/api';
        const NG_HEADERS = { 'ngrok-skip-browser-warning': 'true' };

        async function getAppCheckHeaders() {
            let appCheckToken = "";
            if (typeof firebase !== 'undefined' && firebase.appCheck) {
                try {
                    const appCheckResponse = await firebase.appCheck().getToken(false);
                    appCheckToken = appCheckResponse.token;
                } catch (err) {
                    console.error("Failed to get Firebase App Check token:", err);
                }
            }
            return { 'X-Firebase-AppCheck': appCheckToken };
        }

        async function getAuthHeaders() {
            try {
                const tokenResponse = await fetch(`${API_BASE_URL}/auth/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...NG_HEADERS }
                });
                if (tokenResponse.ok) {
                    const tokenData = await tokenResponse.json();
                    if (tokenData && tokenData.token) {
                        const appCheckHeaders = await getAppCheckHeaders();
                        return {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${tokenData.token}`,
                            ...appCheckHeaders,
                            ...NG_HEADERS
                        };
                    }
                }
            } catch (err) {
                console.error("Failed to acquire auth token:", err);
            }

            const fallbackAppCheck = await getAppCheckHeaders();
            return {
                'Content-Type': 'application/json',
                ...fallbackAppCheck,
                ...NG_HEADERS
            };
        }

        async function loadFullNotice() {
            // Parse URL parameters to retrieve societyId
            const urlParams = new URLSearchParams(window.location.search);
            const societyId = urlParams.get('id');
            
            const contentDiv = document.getElementById('notice-full-content');
            const dateSpan = document.getElementById('notice-date');

            if (!societyId) {
                contentDiv.innerText = "Error: Invalid notice resource reference.";
                dateSpan.innerText = "";
                return;
            }

            try {
                const headers = await getAuthHeaders();
                const response = await fetch(`${API_BASE_URL}/notices/${encodeURIComponent(societyId)}`, { headers });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.todayMessage) {
                        contentDiv.innerText = data.todayMessage;
                        if (data.date) {
                            dateSpan.innerText = data.date;
                        } else {
                            dateSpan.innerText = new Date().toLocaleDateString('en-CA');
                        }
                    } else {
                        contentDiv.innerText = "No active notices for today.";
                        dateSpan.innerText = "";
                    }
                } else if (response.status === 404) {
                    contentDiv.innerText = "Notice record could not be found.";
                    dateSpan.innerText = "";
                } else {
                    contentDiv.innerText = "Failed to load notice from server.";
                    dateSpan.innerText = "";
                }
            } catch (error) {
                console.error("Error reading notice archive via API:", error);
                contentDiv.innerText = "An unexpected error occurred while fetching notice.";
            }
        }

        window.addEventListener("DOMContentLoaded", loadFullNotice);
    </script>

    <div id="owl-container">
        <div id="owl-icon" role="button" tabindex="0" aria-label="Play owl sound" onclick="activateOwlEffect()">
            <img src="owl.png" alt="Owl Watcher" width="52" height="52">
        </div>
        <audio id="owl-audio" src="theme.mp3" preload="auto"></audio>
    </div>


    <script>
      function activateOwlEffect() {
        const container = document.getElementById('owl-container');
        const audio = document.getElementById('owl-audio');

        if (container.classList.contains('active-effect')) return;

        audio.currentTime = 0;
        audio.play().catch(error => {
          console.log("Audio playback blocked or file not found:", error);
        });

        container.classList.add('active-effect');

        setTimeout(() => {
          container.classList.remove('active-effect');
        }, 2000);
      }
    </script>
    
</body>
